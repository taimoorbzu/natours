<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background-color: #f1f5f9;
        margin: 0;
        padding: 40px 20px;
      }
      .container {
        max-width: 580px;
        margin: 0 auto;
        background-color: #ffffff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        border: 1px solid #e2e8f0;
      }
      .header {
        background-color: #0f172a;
        padding: 24px;
        text-align: center;
      }
      .header h1 {
        color: #38bdf8;
        margin: 0;
        font-size: 20px;
        letter-spacing: 0.5px;
      }
      .content {
        padding: 32px 28px;
      }
      .greeting {
        font-size: 16px;
        color: #1e293b;
        margin-bottom: 16px;
      }
      .text {
        color: #475569;
        font-size: 15px;
        line-height: 1.6;
      }
      .btn-container {
        text-align: center;
        margin: 32px 0;
      }
      .btn {
        background-color: #10b981;
        color: #ffffff !important;
        padding: 14px 28px;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 15px;
        display: inline-block;
      }
      .footer {
        background-color: #f8fafc;
        padding: 20px;
        text-align: center;
        border-top: 1px solid #e2e8f0;
        font-size: 12px;
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>NATOURS</h1>
      </div>
      <div class="content">
        <div class="greeting">Hi {{NAME}},</div>
        <p class="text">
          Forgot your password? Click the button below to reset your password.
          This link is valid for <strong>10 minutes</strong> only.
        </p>
        <div class="btn-container">
          <a href="{{RESET_URL}}" class="btn">Reset Password</a>
        </div>
        <p class="text" style="font-size: 13px; color: #64748b">
          If you didn't request a password reset, please ignore this email.
        </p>
      </div>
      <div class="footer">&copy; Natours Inc. All rights reserved.</div>
    </div>
  </body>
</html>
